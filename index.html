<meta name="version" content="V23">
<style>
  :root{

  html{background:var(--bg);}

  .brand{position:relative;display:inline-block;margin-bottom:42px;}
  .ingot{display:inline-grid;font-family:var(--serif);font-size:44px;font-weight:800;letter-spacing:7px;

    background-size:260% 100%;background-position:130% 0;background-repeat:no-repeat;animation:glint 6.5s ease-in-out infinite;}
  @keyframes glint{0%,55%{background-position:130% 0}100%{background-position:-30% 0}}
  @supports ((-webkit-background-clip:text) or (background-clip:text)){

    .ingot-face{-webkit-text-stroke:0.8px rgba(255,246,196,0.8);}}
  .pyr-scene{position:absolute;top:calc(100% - 6px);width:44px;height:42px;margin-left:-22px;perspective:230px;pointer-events:none;}

  .tier{position:absolute;left:50%;height:9px;width:var(--w);margin-left:calc(var(--w) / -2);

  .tier .f{position:absolute;left:0;top:0;width:var(--w);height:9px;border:0.5px solid rgba(60,38,0,0.6);

      linear-gradient(180deg,var(--fa),var(--fb));}

    text-shadow:0 0 7px rgba(255,70,50,0.55),0 0 2px rgba(255,180,100,0.6);}
  .tile .ch.flip{animation:flip .09s ease-in-out;}

  .board-ribbon{position:absolute;inset:7px;border-radius:22px / 18px;border:1px solid rgba(212,175,55,0.55);

  .board::before{left:-4.5px;} .board::after{right:-4.5px;}

  .board{transition:box-shadow .18s ease-out;}

/* =====================================================================
   ENGINE
   Always Prime equation  n*beta - 4 = m(3m^2 - alpha + 1625)
   has a solution (alpha, beta) with 0 < alpha <= n, beta > 0  iff gcd(m, n) = 1.
   So "no solution" iff m shares an odd factor with n. The first m > 5n with
   no solution is m = 5n + p, and gcd(m, n) = p. We sweep k = 1..sqrt(n)
   testing gcd(k, n) > 1.
   ===================================================================== */
function bitLen(n){ return n.toString(2).length; }
function isqrt(n){
  if(n < 2n) return n;
  let x = 1n << BigInt((bitLen(n) + 1) >> 1);
  while(true){ const y = (x + n / x) >> 1n; if(y >= x) return x; x = y; }
}
const SAFE = BigInt(Number.MAX_SAFE_INTEGER);
function gcdNum(a, b){ while(b){ const t = a % b; a = b; b = t; } return a; }
function gcdBig(a, b){ while(b){ const t = a % b; a = b; b = t; } return a; }

/* Mechanism check: hasSolution(m,n) iff gcd(m,n)=1. Used by the Tests button only. */
function hasSolutionCheck(m, n){ return gcdBig(m, n) === 1n; }

function makeScan(n){
  const lim = isqrt(n);
  if(n <= SAFE) return {n, useNum:true, nNum:Number(n), limNum:Number(lim), k:1, m:5n*n+1n, found:null, done:false};
  return {n, useNum:false, lim, k:1n, m:5n*n+1n, found:null, done:false};
}
function scanSlice(s, budgetMs){
  const t0 = performance.now();
  const n5 = 5n * s.n;
  if(s.useNum){
    const nn = s.nNum, lim = s.limNum;
    let k = Number(s.k);
    while(k <= lim){
      for(let i = 0; i < 65536 && k <= lim; i++, k++){
        if(k % 5 === 0) continue;               // exclusion m ≡ 0 (mod 5)
        const g = gcdNum(k, nn);
        if(g > 1){ s.k = k; s.m = n5 + BigInt(k); s.found = BigInt(g); s.done = true; return; }
      }
      s.k = k; s.m = n5 + BigInt(k);
      if(performance.now() - t0 > budgetMs) return;
    }
    s.k = k; s.done = true;
  } else {
    const n = s.n, lim = s.lim;
    let k = s.k;
    while(k <= lim){
      for(let i = 0; i < 512 && k <= lim; i++, k += 1n){
        if(k % 5n === 0n) continue;
        const g = gcdBig(k, n);
        if(g > 1n){ s.k = k; s.m = n5 + k; s.found = g; s.done = true; return; }
      }
      s.k = k; s.m = n5 + k;
      if(performance.now() - t0 > budgetMs) return;
    }
    s.k = k; s.done = true;
  }
}

/* ---------- Web Worker (quantum mode) ---------- */
function workerMain(){
  self.onmessage = function(e){
    const d = e.data;
    if(d.cmd === 'stop'){ self._stop = true; return; }
    const n = BigInt(d.n), start = d.start, step = d.step;
    const lim = isqrt(n);
    let lastPost = 0;
    if(n <= BigInt(Number.MAX_SAFE_INTEGER)){
      const nn = Number(n), l = Number(lim);
      let k = start;
      while(k <= l){
        if(self._stop) return;
        for(let i = 0; i < 65536 && k <= l; i++, k += step){
          if(k % 5 === 0) continue;
          let a = k, b = nn; while(b){ const tt = a % b; a = b; b = tt; }
          if(a > 1){ postMessage({t:'found', p:String(a), k:String(k)}); return; }
        }
        const now = Date.now();
        if(now - lastPost > 120){ lastPost = now; postMessage({t:'prog', k:String(k)}); }
      }
    } else {
      const stepB = BigInt(step);
      let k = BigInt(start);
      while(k <= lim){
        if(self._stop) return;
        for(let i = 0; i < 512 && k <= lim; i++, k += stepB){
          if(k % 5n === 0n) continue;
          let a = k, b = n; while(b){ const tt = a % b; a = b; b = tt; }
          if(a > 1n){ postMessage({t:'found', p:a.toString(), k:k.toString()}); return; }
        }
        const now = Date.now();
        if(now - lastPost > 120){ lastPost = now; postMessage({t:'prog', k:k.toString()}); }
      }
    }
    postMessage({t:'done'});
  };
}
const WORKER_SRC = [bitLen.toString(), isqrt.toString(), '(' + workerMain.toString() + ')();'].join(';\n');

try{ const sv = localStorage.getItem('wurus_lang'); if(sv === 'fr' || sv === 'en') lang = sv; }catch(e){}

function fmtDur(ms){ if(ms < 1000) return '< 1 s'; return fmtDial(ms); }
function fmtDial(ms){
  const total = Math.floor(ms / 1000);
  const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
  return `${h} h ${String(m).padStart(2,'0')} min ${String(s).padStart(2,'0')} s`;

let audioCtx = null;
function getAC(){ try{ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null;
  audioCtx = audioCtx || new AC(); if(audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }catch(e){ return null; } }
function clickSound(){
  const ac = getAC(); if(!ac) return;
  const t = ac.currentTime;
  const len = Math.max(1, Math.floor(ac.sampleRate * 0.014));
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
  const src = ac.createBufferSource(); src.buffer = buf;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2200; bp.Q.value = 1.1;
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
  src.connect(bp); bp.connect(g); g.connect(ac.destination); src.start(t);
}
function primeChime(){
  const ac = getAC(); if(!ac) return;
  const t0 = ac.currentTime;
  [880, 1108.73, 1318.51].forEach((f, i) => {
    const t = t0 + i * 0.10;
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(f, t);
    const osc2 = ac.createOscillator(), g2 = ac.createGain();
    osc2.type = 'sine'; osc2.frequency.setValueAtTime(f * 2, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
    g2.gain.setValueAtTime(0.0001, t); g2.gain.exponentialRampToValueAtTime(0.05, t + 0.02); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.95);
    osc.connect(g); g.connect(ac.destination); osc2.connect(g2); g2.connect(ac.destination);
    osc.start(t); osc.stop(t + 0.95); osc2.start(t); osc2.stop(t + 0.95);
  });
}

function validate(rawInput){
  const raw = rawInput.replace(/[\s,_']/g, '').replace(/^0+(?=\d)/, '');
  if(!/^[0-9]+$/.test(raw)) return {key:'errDigits'};
  if(raw.length > MAX_DIGITS) return {key:'errLong', arg:raw.length};
  const n = BigInt(raw);
  if(n < 3n) return {key:'errSmall'};
  if(n % 2n === 0n) return {key:'errEven'};
  if(raw !== '5' && raw[raw.length - 1] === '5') return {key:'errFive'};
  return {n};
}
function boardCheck(rawInput){
  try{
    const stripped = rawInput.replace(/[\s,_']/g, '');
    if(stripped.length > MAX_DIGITS + 16) return {key:'errDigits'};
    const hasLeadingZero = /^0\d/.test(stripped);
    const raw = stripped.replace(/^0+(?=\d)/, '');
    if(!raw) return {key:null};
    if(hasLeadingZero) return {key:'errDigits'};
    if(!/^[0-9]+$/.test(raw)) return {key:'errDigits'};
    const n = BigInt(raw);
    if(n % 2n === 0n) return {key:'errEven'};
    if(raw !== '5' && raw[raw.length - 1] === '5') return {key:'errFive'};
    return {key:null};
  }catch(e){ return {key:'errDigits'}; }
}

function finish(n, t0, threads, res){
  stopDial(); setRunningUI(false);
  lastRes = Object.assign({n, ms: performance.now() - t0, threads}, res);
  if(lastRes.kind === 'factored'){
    let g = lastRes.p;
    const p = (g < n / g) ? g : n / g;
    const q = n / p;
    const G = n + 6n * p - p * p;
    const m505 = 5n * n + p * (p - 3n);
    lastRes.p = p; lastRes.q = q; lastRes.G = G; lastRes.m505 = m505;
    // p.q = n is what matters; the G identity is shown as a marker, never a failure.
    lastRes.identOk = ((9n + n - G) === (p - 3n) * (p - 3n));
    if(!(p > 1n && n % p === 0n && p * q === n))
      lastRes = {kind:'error', key:'errInternal'};
  }
  if(lastRes.kind === 'prime') primeChime();
  renderResult();
}

function runSingle(n, t0){
  const s = makeScan(n);
  (function step(){
    if(stopRequested){ finish(n, t0, 1, {kind:'stopped'}); return; }
    scanSlice(s, 30);
    if(dialState) dialState.p = s.m;
    if(s.done){
      if(s.found) finish(n, t0, 1, {kind:'factored', p:s.found});
      else finish(n, t0, 1, {kind:'prime'});
      return;
    }
    setTimeout(step, 0);
  })();
}

function killWorkers(){ activeWorkers.forEach(w => { try{ w.terminate(); }catch(e){} }); activeWorkers = []; }

function runQuantum(n, t0){
  const W = HW;
  let url, workers = [];
  try{
    url = URL.createObjectURL(new Blob([WORKER_SRC], {type:'text/javascript'}));
    for(let i = 0; i < W; i++) workers.push(new Worker(url));
    activeWorkers = workers;
  }catch(e){
    workers.forEach(w => { try{ w.terminate(); }catch(_){} });
    if(url) URL.revokeObjectURL(url);
    quantumFailed = true; updateModeUI();
    runSingle(n, t0); return;
  }
  const prog = new Array(W).fill(0n).map((_, i) => BigInt(1 + i));
  const finishedW = new Array(W).fill(false);
  const founds = [];
  let ended = false;
  const end = (res) => {
    if(ended) return; ended = true;
    killWorkers(); URL.revokeObjectURL(url); clearInterval(stopPoll);
    finish(n, t0, W, res);
  };
  // Pick the least k across all workers, confirmed once no running worker can
  // still reach a smaller k. This guarantees the minimal prime factor is returned
  // regardless of which worker reports first.
  const tryConclude = () => {
    if(ended) return;
    if(founds.length){
      let best = founds[0];
      for(const f of founds) if(f.k < best.k) best = f;
      let confirmed = true;
      for(let i = 0; i < W; i++){
        if(!finishedW[i] && prog[i] <= best.k){ confirmed = false; break; }
      }
      if(confirmed) end({kind:'factored', p:best.p});
    } else if(finishedW.every(Boolean)){
      end({kind:'prime'});
    }
  };
  const stopPoll = setInterval(() => { if(stopRequested) end({kind:'stopped'}); }, 50);
  workers.forEach((w, i) => {
    w.onmessage = (e) => {
      const m = e.data;
      if(m.t === 'found'){
        founds.push({p:BigInt(m.p), k:BigInt(m.k)});
        finishedW[i] = true;
        tryConclude();
      } else if(m.t === 'prog'){
        prog[i] = BigInt(m.k);
        let lo = null;
        for(let j = 0; j < W; j++){ if(!finishedW[j] && (lo === null || prog[j] < lo)) lo = prog[j]; }
        if(dialState && lo !== null) dialState.p = 5n * n + lo;
        tryConclude();
      } else if(m.t === 'done'){
        finishedW[i] = true;
        tryConclude();
      }
    };
    w.onerror = () => {
      if(ended) return; ended = true; clearInterval(stopPoll); killWorkers(); URL.revokeObjectURL(url);
      quantumFailed = true; updateModeUI(); runSingle(n, t0);
    };
    w.postMessage({n:n.toString(), start:1 + i, step:W});
  });
}

function bigDecDiv(num, den, places){
  let neg = (num < 0n) !== (den < 0n);
  num = num < 0n ? -num : num; den = den < 0n ? -den : den;
  let ip = num / den, rem = num % den, frac = '';
  for(let i = 0; i < places; i++){ rem *= 10n; frac += (rem / den).toString(); rem %= den; }
  return (neg ? '-' : '') + ip.toString() + '.' + frac;
}

  const sOk = (2n * num505 > den505) && (num505 < den505);
  const ok = v => v ? '<span class="ok">✓</span>' : '<span class="ko">✗</span>';

const THEME_ANCHORS = [
  {bg:[197,74,6],  bg2:[200,70,9],  surface:[195,68,11], surface2:[198,76,4],   line:[190,60,21], line2:[192,55,15], glow:[186,90,45], accent:[186,90,62]},

];
function lerpHsl(a, b, t){ const dh = ((b[0] - a[0] + 540) % 360) - 180;
  return [(a[0] + dh * t + 360) % 360, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function hslCss(c){ return `hsl(${c[0].toFixed(1)} ${c[1].toFixed(1)}% ${c[2].toFixed(1)}%)`; }
function hslHex(c){
  const h = c[0], s = c[1] / 100, l = c[2] / 100;
  const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return '#' + [f(0), f(8), f(4)].map(v => Math.round(v * 255).toString(16).padStart(2, '0')).join('');
}
function applyTheme(v){
  const seg = v <= 50 ? 0 : 1, t = seg === 0 ? v / 50 : (v - 50) / 50;
  const A = THEME_ANCHORS[seg], B = THEME_ANCHORS[seg + 1];
  const style = document.documentElement.style, mix = {};
  Object.keys(A).forEach(k => { mix[k] = lerpHsl(A[k], B[k], t); style.setProperty('--' + k, hslCss(mix[k])); });
  style.setProperty('--glow', `hsl(${mix.glow[0].toFixed(1)} ${mix.glow[1].toFixed(1)}% ${mix.glow[2].toFixed(1)}% / 0.16)`);
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', hslHex(mix.bg));
}

(function vintageKnob(){
  const cv=mobiusCv; if(!cv) return; const ctx=cv.getContext('2d'); const Wc=cv.width, Hc=cv.height;
  const cx=Wc/2, cy=Hc/2, R=Math.min(Wc,Hc)*0.38;
  const stops=[-Math.PI*0.75, -Math.PI*0.5, -Math.PI*0.25];
  const dotCols=['hsl(186,85%,60%)','hsl(312,85%,72%)','hsl(352,85%,66%)'];
  let ang=stops[themeIdx]||stops[0], target=ang, last=performance.now();
  cv.parentNode.__setKnob=(i)=>{ target=stops[i%stops.length]; };
  function frame(now){ last=now; ang+=(target-ang)*0.18;
    ctx.clearRect(0,0,Wc,Hc);
    let g=ctx.createRadialGradient(cx-R*0.3,cy-R*0.3,R*0.2,cx,cy,R*1.3);
    g.addColorStop(0,'#3a3f47'); g.addColorStop(1,'#0b0d10');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,R*1.2,0,6.28); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.14)'; ctx.lineWidth=1; ctx.stroke();
    g=ctx.createRadialGradient(cx-R*0.35,cy-R*0.35,R*0.1,cx,cy,R);
    g.addColorStop(0,'#2b2f36'); g.addColorStop(.7,'#15181d'); g.addColorStop(1,'#0a0c0f');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,R,0,6.28); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(cx,cy,R*0.82,0,6.28); ctx.stroke();
    for(let i=0;i<3;i++){ const a=stops[i], dx=cx+Math.cos(a)*R*1.05, dy=cy+Math.sin(a)*R*1.05;
      ctx.beginPath(); ctx.arc(dx,dy,2,0,6.28);
      if(i===themeIdx){ ctx.fillStyle=dotCols[i]; ctx.shadowColor=dotCols[i]; ctx.shadowBlur=6; } else ctx.fillStyle='rgba(255,255,255,0.28)';
      ctx.fill(); ctx.shadowBlur=0; }
    const px=cx+Math.cos(ang)*R*0.82, py=cy+Math.sin(ang)*R*0.82;
    ctx.strokeStyle='#f3e4b0'; ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.shadowColor='#f3e4b0'; ctx.shadowBlur=4;
    ctx.beginPath(); ctx.moveTo(cx+Math.cos(ang)*R*0.14, cy+Math.sin(ang)*R*0.14); ctx.lineTo(px,py); ctx.stroke(); ctx.shadowBlur=0;
    ctx.beginPath(); ctx.arc(cx,cy,R*0.16,0,6.28); ctx.fillStyle='#43484f'; ctx.fill();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

  const tiers = widths.map((w, i) => {
    const tier = document.createElement('div'); tier.className = 'tier';
    tier.style.setProperty('--w', w + 'px'); tier.style.bottom = (4 + i * H) + 'px';
    ['front', 'right', 'back', 'left', 'top'].forEach(face => {
      const f = document.createElement('div'); f.className = 'f ' + face; tier.appendChild(f);
    });
    root.appendChild(tier); return tier;
  });
  const angle = [0, 0, 0], order = [0, 2, 1, 0, 1, 2]; let step = 0;
  function twist(){ const i = order[step % order.length]; angle[i] += (step % 2 ? -90 : 90);
    tiers[i].style.transform = `rotateY(${angle[i]}deg)`; step++; }
  window.twistPyramid = twist;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce) setInterval(twist, 1300);
  function place(){ const a = anchor.getBoundingClientRect(), b = brand.getBoundingClientRect();
    scene.style.left = (a.left - b.left + a.width / 2) + 'px'; }
  place(); window.addEventListener('resize', place); window.addEventListener('load', place);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(place);
})();

/* ---------- Tests (factorization + mechanism check) ---------- */
window.__tests = () => {
  const cases = [[391n,17n],[551n,19n],[851n,23n],[1147n,31n],[187n,11n],[231n,3n],[1001n,7n]];
  const out = [];
  let allOk = true;
  for(const [n, expected] of cases){
    const lim = isqrt(n); let k = 1n, found = null;
    while(k <= lim && !found){ const g = gcdBig(k, n); if(g > 1n && g < n) found = g; k++; }
    const ok = found === expected; if(!ok) allOk = false;
    let mechOk = true;
    for(const m of [5n*n + 1n, 5n*n + expected, 5n*n + 2n*expected]){
      if(hasSolutionCheck(m, n) !== (gcdBig(m, n) === 1n)) mechOk = false;
    }
    out.push(`n=${n} -> least p=${found} ${ok?'OK':'FAIL'} · mechanism ${mechOk?'OK':'FAIL'}`);
  }
  out.push(allOk ? 'All tests pass OK' : 'FAIL');
  console.log(out.join('\n'));
  return out;
};

applyLang();
</script>

<script>
/* ===== Header animation: flowing ribbon drones + "+" figurine (Thierno M. Sow Polymath) ===== */
(function(){
  const header=document.querySelector('.header'); if(!header) return;
  const brand=document.getElementById('brand'), flap=document.getElementById('matrixFlap');
  const pyr=document.getElementById('pyrScene'); if(pyr) pyr.style.display='none';
  function mk(z){ const c=document.createElement('canvas'); c.style.cssText='position:absolute;inset:0;z-index:'+z+';pointer-events:none;'; return c; }
  const cvB=mk(1), cvF=mk(3);
  header.insertBefore(cvB, header.children[1]||null); header.appendChild(cvF);
  const ctxB=cvB.getContext('2d'), ctxF=cvF.getContext('2d');
  const lerp=(a,b,t)=>a+(b-a)*t, easeOut=t=>1-Math.pow(1-t,3), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  let Wd=0,Hd=0,dpr=Math.min(window.devicePixelRatio||1,2);
  let BX=0,BY=0,BW=0,BH=0,PLUSX=0,PLUSY=0,FIGX=0,FIGY=0;
  function size(c,ctx){ const w=Math.round(Wd*dpr), h=Math.round(Hd*dpr); if(c.width!==w||c.height!==h){ c.width=w; c.height=h; c.style.width=Wd+'px'; c.style.height=Hd+'px'; } ctx.setTransform(dpr,0,0,dpr,0,0); }
  function measure(){ const hr=header.getBoundingClientRect(); Wd=hr.width; Hd=hr.height; size(cvB,ctxB); size(cvF,ctxF);
    const br=brand.getBoundingClientRect(), fr=flap.getBoundingClientRect();
    BX=br.left-hr.left; BY=br.top-hr.top; BW=br.width; BH=br.height;
    PLUSX=fr.left-hr.left+fr.width*(5.5/7); PLUSY=fr.top-hr.top+fr.height/2;
    FIGX=BX+BW*0.5; FIGY=((br.bottom-hr.top)+(fr.top-hr.top))/2; }
  let rafM=0; const scheduleMeasure=()=>{ if(rafM) return; rafM=requestAnimationFrame(()=>{ rafM=0; measure(); }); };
  window.addEventListener('resize',scheduleMeasure,{passive:true});
  if(window.ResizeObserver) new ResizeObserver(scheduleMeasure).observe(header);
  let vis=true;
  if(window.IntersectionObserver) new IntersectionObserver(es=>{ vis=es[0].isIntersecting; },{rootMargin:'80px'}).observe(header);

  const ND=110, drones=[]; for(let i=0;i<ND;i++){ const z=Math.random();
    drones.push({u:i/ND, r:i%3, z, front:(z>=0.5), x:0,y:0,px:0,py:0,a:0}); }
  let T=0, P=0;
  /* ribbon kinematics across the brand width */
  function ribbon(d){ const cx=BX+BW/2, sp=BW*0.52, cy=BY+BH*0.5, A=BH*0.74, u=d.u*6.2832; let x,y;
    if(d.r===0){ x=cx+sp*Math.sin(T*0.55+u);     y=cy+A*Math.sin(T*1.15+u); }
    else if(d.r===1){ x=cx+sp*Math.sin(T*0.55+u+2.1); y=cy+A*0.86*Math.sin(T*1.30+u+1); }
    else { x=cx+sp*0.80*Math.cos(T*0.48+u); y=cy+A*1.08*Math.sin(T*0.95+u*2); }
    return {x,y}; }
  function glow(ctx,x,y,r,col,al){ ctx.globalAlpha=al; const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,6.28); ctx.fill(); ctx.globalAlpha=1; }
  function accentHue(){ const c=getComputedStyle(document.documentElement).getPropertyValue('--accent'); const m=c&&c.match(/[\d.]+/); return m?parseFloat(m[0]):186; }
  function drawDrone(ctx,d,col){ if(d.a<0.02)return; ctx.globalAlpha=d.a*(d.front?1:0.6);
    const g=ctx.createLinearGradient(d.px,d.py,d.x,d.y); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,col);
    ctx.strokeStyle=g; ctx.lineWidth=d.front?2.4:1.6; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(d.px,d.py); ctx.lineTo(d.x,d.y); ctx.stroke();
    glow(ctx,d.x,d.y,d.front?5:3.4, col, d.a*(d.front?0.95:0.6)); ctx.globalAlpha=1; }
  const dotAng=[0,Math.PI/2,Math.PI,3*Math.PI/2];
  function drawFig(ctx){ const e=easeOut(clamp((P-0.3)/1.3,0,1));
    const cx=lerp(PLUSX,FIGX,e)+Math.sin(T*1.15)*11, cy=lerp(PLUSY,FIGY,e)+Math.sin(T*2.4)*1.3, h=accentHue();
    const cols=['hsl('+h+',92%,66%)','hsl('+((h+30)%360)+',88%,72%)','hsl('+((h+330)%360)+',84%,62%)','#f3d98a'];
    const rot=T*0.85, rr=10;
    for(let k=0;k<4;k++){ const a=dotAng[k]+rot, px=cx+Math.cos(a)*rr, py=cy+Math.sin(a)*rr;
      const pulse=0.55+0.45*Math.sin(T*4-k*0.95); glow(ctx,px,py,(2.0+1.3*pulse)*1.8, cols[k], (0.55+0.45*pulse)*e); } }

  let last=performance.now();
  function loop(now){ const dt=Math.min(0.05,(now-last)/1000); last=now;
    if(!vis){ requestAnimationFrame(loop); return; }   // pause work when header is off-screen (smooth scroll)
    T+=dt; P+=dt;
    if(!Wd) measure();
    ctxB.clearRect(0,0,Wd,Hd); ctxF.clearRect(0,0,Wd,Hd);
    const em=clamp((P-0.6)/1.1,0,1); const h=accentHue(), dcol='hsl('+((h+6)%360)+',88%,66%)';
    ctxB.globalCompositeOperation='lighter'; ctxF.globalCompositeOperation='lighter';
    for(const d of drones){ d.a=lerp(d.a,em,0.08); d.px=d.x||BX+BW/2; d.py=d.y||BY+BH/2;
      const r=ribbon(d); d.x=d.x?lerp(d.x,r.x,0.14):r.x; d.y=d.y?lerp(d.y,r.y,0.14):r.y;
      drawDrone(d.front?ctxF:ctxB, d, dcol); }
    drawFig(ctxF);
    ctxB.globalCompositeOperation='source-over'; ctxF.globalCompositeOperation='source-over';
    requestAnimationFrame(loop);
  }
  measure(); requestAnimationFrame(loop);
})();
</script>
